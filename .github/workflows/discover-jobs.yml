name: Discover job circulars

# Runs every 10 minutes (GitHub may delay this somewhat under load — that's fine,
# freshness within a few minutes is the goal, not millisecond-exact matching).
# Also runnable on demand from the Actions tab for testing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no API calls, no commits)"
        type: boolean
        default: false

concurrency:
  group: discover-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run discovery + generation
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run discover:dry-run
          else
            npm run discover
          fi

      - name: Commit new articles
        run: |
          git config user.name "baya-blog-bot"
          git config user.email "bot@baya.blog"
          git add content-data/
          if git diff --cached --quiet; then
            echo "No new articles — nothing to commit."
          else
            git commit -m "chore: discover new job circular(s) [automated]"
            git push
          fi
